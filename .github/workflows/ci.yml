name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test"

      - run: go vet ./...

      - run: go test ./... -race -count=1
